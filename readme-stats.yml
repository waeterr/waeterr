name: Generate README stats SVGs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC
  push:
    branches:
      - main  # runs on pushes to main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create output directories
        run: |
          mkdir -p stats-output languages-output pacman-output

      - name: Download GitHub Readme Stats (stats & top languages)
        run: |
          # Update the username and query params if you want different options
          curl -L "https://github-readme-stats.vercel.app/api?username=waeterr&show_icons=true&theme=dracula&include_all_commits=true&count_private=true" -o stats-output/stats.svg
          curl -L "https://github-readme-stats.vercel.app/api/top-langs/?username=waeterr&layout=compact&theme=dracula" -o languages-output/languages.svg

      - name: (Optional) Generate pacman/pixel graph
        run: |
          # If you have a generator action for pacman-style contribution graphs, replace this step.
          # For now create a simple placeholder or download a generated SVG into pacman-output/
          echo "<!-- pacman graph placeholder -->" > pacman-output/galaga-contribution-graph.svg

      - name: Commit and push generated images
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'chore: update README stats images'
          branch: main
